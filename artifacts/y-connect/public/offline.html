<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Y-Connect — offline</title>
    <meta name="theme-color" content="#204d58" />
    <style>
      :root { color-scheme: light; }
      body { margin: 0; min-height: 100dvh; display: grid; place-items: center; background: #f0f7f8; color: #111827; font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; padding: 24px; }
      .card { max-width: 26rem; text-align: center; }
      .mark { width: 48px; height: 48px; border-radius: 12px; background: #204d58; color: #fff; display: grid; place-items: center; font-weight: 600; margin: 0 auto 20px; font-size: 20px; }
      h1 { font-size: 1.5rem; margin: 0 0 12px; }
      p { color: #6b7280; line-height: 1.6; margin: 0 0 20px; }
      button { border: none; background: #204d58; color: #fff; padding: 10px 18px; border-radius: 10px; font-weight: 600; cursor: pointer; font-size: 0.9rem; }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="mark">Y</div>
      <h1>You're offline</h1>
      <p>Y-Connect could not reach the network. Content and workspace pages you've already opened may still be available. Try again once you're back online.</p>
      <button onclick="location.reload()">Try again</button>
    </div>
  </body>
</html>
